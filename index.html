<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UIBridge</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="ui-chrome" id="chrome-top">
    <div class="chrome-inner">
      <span class="brand">UIBridge</span>
      <label class="preset-picker">
        <span>プリセット</span>
        <select id="preset-select" aria-label="プリセット選択"></select>
      </label>
      <div class="preset-actions">
        <button type="button" id="preset-save" class="chip-btn" title="現在の状態を新しいユーザープリセットとして保存">保存</button>
        <button type="button" id="preset-rename" class="chip-btn" title="選択中のユーザープリセットの名前を変更" hidden>名前変更</button>
        <button type="button" id="preset-delete" class="chip-btn chip-btn--danger" title="選択中のユーザープリセットを削除" hidden>削除</button>
        <button type="button" id="output-open" class="chip-btn chip-btn--primary" title="現在のデザインをコードとして出力">出力</button>
        <button type="button" id="png-save" class="chip-btn" title="プレビュー領域を PNG として保存">PNG保存</button>
      </div>
    </div>
  </header>

  <dialog id="output-dialog" class="output-dialog" aria-label="出力">
    <div class="output-head">
      <div class="output-tabs" role="tablist" id="output-tabs">
        <button role="tab" data-format="html" class="tab is-active">HTML + CSS</button>
        <button role="tab" data-format="vars" class="tab">CSS変数</button>
        <button role="tab" data-format="text" class="tab">自然言語</button>
      </div>
      <div class="output-actions">
        <button type="button" id="output-copy" class="chip-btn">コピー</button>
        <button type="button" id="output-close" class="chip-btn">閉じる</button>
      </div>
    </div>
    <pre class="output-code" id="output-code"></pre>
  </dialog>

  <main class="preview" id="preview" data-role="preview">
    <section class="preview-inner">
      <h1 class="preview-title">Preview</h1>
      <p class="preview-lead">プリセットを切り替えたり、下の調整パネルをいじると即時に反映されます。</p>

      <div class="logo-stage" id="logo-stage" aria-label="ロゴプレビュー"></div>

      <div class="preview-row">
        <button class="ui-button" type="button" contenteditable="plaintext-only" spellcheck="false">Click me</button>
        <button class="ui-button" type="button" contenteditable="plaintext-only" spellcheck="false">Secondary</button>
      </div>

      <div class="ui-card">
        <h2 class="card-title">Card title</h2>
        <p class="card-body">これはカードのサンプルです。パーツの見た目はデザイントークンから生成されます。</p>
      </div>

      <label class="ui-input-wrap">
        <span class="input-label">入力欄</span>
        <input class="ui-input" type="text" placeholder="ここに入力…">
      </label>
    </section>
  </main>

  <aside class="panel" id="panel" aria-label="調整パネル">
    <div class="panel-tabs" role="tablist" id="panel-tabs">
      <button role="tab" data-part="background" class="tab is-active">背景</button>
      <button role="tab" data-part="logo" class="tab">ロゴ</button>
      <button role="tab" data-part="button" class="tab">ボタン</button>
      <button role="tab" data-part="card" class="tab">カード</button>
      <button role="tab" data-part="input" class="tab">入力欄</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
