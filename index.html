<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UIBridge</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="ui-chrome" id="chrome-top">
    <div class="chrome-inner">
      <span class="brand">UIBridge</span>
      <label class="preset-picker">
        <span>プリセット</span>
        <select id="preset-select" aria-label="プリセット選択"></select>
      </label>
    </div>
  </header>

  <main class="preview" id="preview" data-role="preview">
    <section class="preview-inner">
      <h1 class="preview-title">Preview</h1>
      <p class="preview-lead">プリセットを切り替えると、この領域のパーツが即座に変わります。</p>

      <div class="preview-row">
        <button class="ui-button" type="button">Click me</button>
        <button class="ui-button" type="button">Secondary</button>
      </div>

      <div class="ui-card">
        <h2 class="card-title">Card title</h2>
        <p class="card-body">これはカードのサンプルです。パーツの見た目はデザイントークンから生成されます。</p>
      </div>

      <label class="ui-input-wrap">
        <span class="input-label">入力欄</span>
        <input class="ui-input" type="text" placeholder="ここに入力…">
      </label>
    </section>
  </main>

  <button class="sheet-toggle" id="sheet-toggle" type="button" aria-controls="sheet" aria-expanded="false">調整</button>

  <aside class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-tabs" role="tablist" id="sheet-tabs">
      <button role="tab" data-part="background" class="tab is-active">背景</button>
      <button role="tab" data-part="button" class="tab">ボタン</button>
      <button role="tab" data-part="card" class="tab">カード</button>
      <button role="tab" data-part="input" class="tab">入力欄</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </aside>
  <div class="sheet-scrim" id="sheet-scrim" hidden></div>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
